  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08151E; --surface:#0F2230; --surface-2:#132B3B; --ink:#E5EFF5; --muted:#8EA5B4; --line:#1F3A4B;
  --navy:#0B3A55; --navy-ink:#E5F4FC; --sky:#3BB7F0; --sky-2:#3FBDF1; --sky-3:#93D9F7; --sky-soft:#12364A;
  --ok:#4CC58C; --ok-soft:#0E3324; --bad:#F27A70; --bad-soft:#3A1816; --warn:#E3A93B; --plate:#E8F4FA; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08151E; --surface:#0F2230; --surface-2:#132B3B; --ink:#E5EFF5; --muted:#8EA5B4; --line:#1F3A4B;
  --navy:#0B3A55; --navy-ink:#E5F4FC; --sky:#3BB7F0; --sky-2:#3FBDF1; --sky-3:#93D9F7; --sky-soft:#12364A;
  --ok:#4CC58C; --ok-soft:#0E3324; --bad:#F27A70; --bad-soft:#3A1816; --warn:#E3A93B; --plate:#E8F4FA; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}

/* masthead */
.mast{background:var(--surface);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:76px;height:auto;background:var(--plate);border-radius:10px;padding:4px}
.brand .nm{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.01em;line-height:1}
.brand .sub{font-family:var(--f-body);font-weight:300;font-size:19px;letter-spacing:.02em;margin-top:2px}
.mast .tag{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);max-width:340px}
.mast .tag b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:700;letter-spacing:.01em}
.strip{background:var(--navy);color:var(--navy-ink)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:9px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.strip a{color:inherit;text-decoration:none;font-weight:600}
.strip span{display:inline-flex;align-items:center;gap:7px}
.strip svg{width:15px;height:15px;opacity:.85}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px}
.tab{background:none;border:0;padding:14px 16px 12px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sky)}
main{padding-block:24px 56px}

.dm{display:inline-block;width:13px;height:13px;flex:none;border-radius:3px;transform:rotate(45deg);
  background:conic-gradient(var(--sky-2) 0 25%,var(--sky-3) 0 50%,#0D6E9E 0 75%,#0B3A55 0)}

/* units */
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:grid;gap:2px}
.unit small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.unit strong{font-family:var(--f-display);font-size:20px;line-height:1.15}
.unit span{font-size:13px;color:var(--muted)}
.unit[aria-pressed="true"]{border-color:var(--sky);box-shadow:inset 0 0 0 1px var(--sky);background:var(--sky-soft)}
@media (max-width:640px){.units{grid-template-columns:1fr}.mast .tag{margin-left:0;text-align:left}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 18px}
.opts label{display:inline-flex;gap:6px;align-items:center}
.notice{background:var(--sky-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}

.grp{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.grp h3{font-size:19px}
.grp em{font-style:normal;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;min-width:0}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .w{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.pos{font-size:12px;font-weight:600;color:var(--sky);background:var(--sky-soft);border-radius:6px;padding:1px 7px;white-space:nowrap;margin-top:3px}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:14px}
.vi{font-weight:600}
.en{color:var(--muted);font-size:14px}
.ex{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;display:flex;gap:8px;align-items:flex-start}
.ex i{font-style:italic}
.say{flex:none;margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--sky)}
.say svg{width:18px;height:18px}
.say.sm{width:28px;height:28px;margin-left:0}
.say.sm svg{width:14px;height:14px}
.say.playing{background:var(--sky);color:#fff;border-color:var(--sky)}
.hide-m .card .vi,.hide-m .card .en{filter:blur(6px);user-select:none;cursor:pointer;transition:filter .15s}
.hide-m .card.show .vi,.hide-m .card.show .en{filter:none}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.n{color:var(--muted);font-variant-numeric:tabular-nums;width:44px}
td .cell{display:inline-flex;align-items:center;gap:8px}
tr:last-child td{border-bottom:0}
.col{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.col li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:10px;font-weight:500}
.col{padding:0;margin:0}

/* practice */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.start{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.start{grid-template-columns:1fr}}
.start h2{font-size:30px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;font-size:16px;width:100%}
.err{color:var(--bad);font-size:13px;min-height:1em}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);font-weight:500}
.chk input{accent-color:var(--sky);width:16px;height:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--sky);color:#fff;font-size:15px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.lg{padding:14px 28px;font-size:16px}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.parts li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:14px}
.parts li b{font-family:var(--f-display);font-size:16px}
.parts li span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}

.qbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px;box-shadow:0 4px 14px rgba(11,58,85,.07)}
.qbar .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.prog{flex:1 1 140px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .2s}
.clock{font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:560px){.qbar .who{display:none}.qbar{gap:10px;padding:8px 10px}.qbar .btn{padding:9px 16px}.prog{flex-basis:90px}}

.part{margin:30px 0 12px;display:flex;gap:12px;align-items:flex-start}
.part .dm{margin-top:7px}
.part h3{font-size:22px}
.part p{margin:2px 0 0;color:var(--muted);font-size:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.q .head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.q .num{font-family:var(--f-display);font-weight:800;color:var(--sky);font-size:17px;min-width:26px;font-variant-numeric:tabular-nums}
.q .pr{flex:1;min-width:0;font-size:16px}
.q .pr .def{font-style:italic}
.q .hint{display:block;color:var(--muted);font-size:13px;margin-top:4px;font-family:var(--f-ipa);letter-spacing:.08em}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--sky);margin:0 3px;transform:translateY(-3px)}
.listen{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--sky);color:var(--sky);background:var(--sky-soft);border-radius:999px;padding:7px 14px;font-weight:600}
.listen svg{width:18px;height:18px}
.listen.playing{background:var(--sky);color:#fff}
.ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.ch{grid-template-columns:1fr}}
.ch label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);min-width:0}
.ch label:has(input:checked){border-color:var(--sky);background:var(--sky-soft);box-shadow:inset 0 0 0 1px var(--sky)}
.ch input{accent-color:var(--sky);flex:none}
.ch .k{font-weight:700;color:var(--muted);font-size:13px;width:16px}
.typein{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 13px;font-size:16px;width:100%;max-width:420px}
.submitrow{display:flex;justify-content:center;margin-top:26px}

.dlg{position:fixed;inset:0;background:rgba(5,20,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg .box{background:var(--surface);border-radius:16px;padding:22px;max-width:400px;width:100%;display:grid;gap:14px}
.dlg .box h3{font-size:22px}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* result */
.res{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.res .rh{background:var(--navy);color:var(--navy-ink);padding:16px 20px;display:flex;align-items:center;gap:12px}
.res .rh img{width:54px;background:#fff;border-radius:8px;padding:3px}
.res .rh .nm{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.res .rh .sb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-top:3px}
.res .rb{padding:18px 20px;display:grid;gap:16px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface-2);border-radius:14px;padding:16px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--sky) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:32px;font-variant-numeric:tabular-nums}
.score .big{font-family:var(--f-display);font-size:26px;font-weight:700}
.score .rate{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;font-weight:700;font-size:14px}
.r-a{background:var(--ok-soft);color:var(--ok)} .r-b{background:var(--sky-soft);color:var(--sky)} .r-c{background:var(--bad-soft);color:var(--bad)}
.brk{display:grid;gap:7px;font-size:13px}
.brk div{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center}
.brk .bar{height:8px}
.brk b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:440px){.brk div{grid-template-columns:110px 1fr 40px}.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.res .rf{border-top:1px dashed var(--line);padding:12px 20px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between}
.res .rf b{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.shot{max-width:560px;margin:14px auto 0;text-align:center;font-weight:600;color:var(--sky)}
.after{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 30px}
.rv{border-left:4px solid var(--ok)}
.rv.x{border-left-color:var(--bad)}
.rv .yours{font-size:14px;margin-top:4px}
.rv .yours .wrong{color:var(--bad);text-decoration:line-through}
.rv .yours .right{color:var(--ok);font-weight:700}
.rv .note{font-size:13px;color:var(--muted);margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:13px;color:var(--muted)}
footer strong{color:var(--ink);font-family:var(--f-display);font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const TTS={ok:"speechSynthesis" in window,voices:[],accent:store.accent||"en-GB",rate:store.rate||0.9};
function loadVoices(){try{TTS.voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(TTS.ok){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function pickVoice(){const want=TTS.accent.toLowerCase();const v=TTS.voices;
  const m=v.filter(x=>(x.lang||"").replace("_","-").toLowerCase().startsWith(want));
  const pool=m.length?m:v.filter(x=>/^en/i.test(x.lang||""));
  return pool.find(x=>/google|natural|neural|premium|enhanced/i.test(x.name))||pool[0]||null}
const spoken=t=>t.replace(/\s*\([^)]*\)/g,"").replace(/\bsb's\b/g,"somebody's").replace(/\bsb\b/g,"somebody").trim();
let playing=null;
function speak(text,btn){
  if(!TTS.ok){toast("Trình duyệt này chưa hỗ trợ đọc. Hãy mở bằng Chrome, Safari hoặc Edge.");return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(spoken(text));const v=pickVoice();
  if(v)u.voice=v;u.lang=v?v.lang:TTS.accent;u.rate=TTS.rate;
  if(playing)playing.classList.remove("playing");
  if(btn){btn.classList.add("playing");playing=btn}
  u.onend=u.onerror=()=>{btn&&btn.classList.remove("playing")};
  speechSynthesis.speak(u);
}

const typeOf=w=>w.t.split(/[ ,]/)[0];
const synOf=w=>{const g=SYN.find(s=>s.includes(w));return g||[w]};
const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[\s\-'.]/g,"");
function variants(a){return [a,a.replace(/isation/g,"ization").replace(/ise$/,"ize"),a.replace("liveable","livable"),a.replace("judgmental","judgemental"),a.replace("judgemental","judgmental")].map(norm)}
function pick(arr,n){return shuffle(arr).slice(0,n)}
function mixUnits(lists,n){ // lấy đều từ các unit
  const L=lists.map(l=>shuffle(l));const out=[];let i=0;
  while(out.length<n&&L.some(l=>l.length)){const l=L[i%L.length];if(l.length)out.push(l.pop());i++}
  return shuffle(out)}
function distract(w,unit,n,sameType){
  const syn=synOf(w.w);const all=UNITS[unit-1].words.filter(x=>x.w!==w.w&&!syn.includes(x.w));
  let pool=sameType?all.filter(x=>typeOf(x)===typeOf(w)):all;
  if(pool.length<n)pool=all;
  return pick(pool,n).map(x=>x.w)}
function buildQuiz(units){
  const per=k=>units.map(u=>({u,...UNITS[u-1]}));
  const Q=[];let id=0;
  const add=(part,o)=>Q.push({id:"q"+(++id),part,...o});
  const W=units.map(u=>UNITS[u-1].words.map(w=>({...w,u})));
  // 1 listen
  mixUnits(W,5).forEach(w=>add("listen",{audio:w.w,prompt:"Bạn nghe thấy từ nào?",opts:shuffle([w.w,...distract(w,w.u,3,false)]),ans:w.w,note:w.vi}));
  // 2 meaning
  mixUnits(W,5).forEach(w=>add("meaning",{prompt:`“<b>${esc(w.vi)}</b>” <span style="color:var(--muted)">(${esc(w.t)})</span> trong tiếng Anh là:`,opts:shuffle([w.w,...distract(w,w.u,3,true)]),ans:w.w,note:w.ipa}));
  // 3 gap
  mixUnits(units.map(u=>GAP[u]),6).forEach(g=>add("gap",{prompt:esc(g[0]).replace("___",'<span class="blank"></span>'),opts:shuffle([g[1],...g[2]]),ans:g[1],say:g[0].replace("___",g[1])}));
  // 4 colloc
  mixUnits(units.map(u=>COL[u]),4).forEach(c=>add("colloc",{prompt:`<span class="blank"></span> ${esc(c[1])}`,opts:shuffle([c[0],...c[2]]),ans:c[0],say:c[0]+" "+c[1]}));
  // 5 family
  const fam=units.map(u=>{const out=[];UNITS[u-1].family.forEach(r=>{
    for(let gi=0;gi<3;gi++)for(let ti=0;ti<3;ti++){
      if(gi===ti||r[gi]==="—"||r[ti]==="—")continue;
      const given=r[gi].split("/")[0].replace("(in)","").trim();
      if(r[ti]===r[gi]||norm(r[ti])===norm(given))continue;
      out.push({r,gi,ti,given})}});
    // mỗi hàng chỉ giữ 1 câu
    const byRow=new Map();shuffle(out).forEach(o=>{if(!byRow.has(o.r))byRow.set(o.r,o)});return [...byRow.values()]});
  mixUnits(fam,4).forEach(o=>{
    const ans=o.r[o.ti];
    let opts=[...new Set(o.r.filter(c=>c!=="—"))].filter(c=>c!==ans);
    const stem=o.given.replace(/(e|ion|ment|ity|ness|ful|al|ive|ous)$/,"");
    const fakes=["ful","ive","ness","ment","ity","ous","al"].map(s=>stem+s);
    const real=new Set(UNITS.flatMap(u=>u.family.flat()).flatMap(c=>c.split("/").map(x=>x.trim().replace("(in)",""))));
    for(const f of shuffle(fakes)){if(opts.length>=3)break;if(!real.has(f)&&f!==ans&&!opts.includes(f))opts.push(f)}
    opts=shuffle([ans,...opts.slice(0,3)]);
    add("family",{prompt:`<b>${POS[o.ti]}</b> của từ “<b>${esc(o.given)}</b>” (${POS[o.gi].toLowerCase()}) là:`,opts,ans,note:`Họ từ: ${o.r.join(" · ")}`});
  });
  // 6 define
  const okDef=w=>!/[()]/.test(w.w)&&!/\bsb\b|sb's/.test(w.w)&&!/^\(/.test(w.en);
  mixUnits(W.map(l=>l.filter(okDef)),3).forEach(w=>{
    const pat=w.w.split("").map((c,i)=>i===0?c:c===" "?" ":c==="-"?"-":"_").join(" ");
    add("define",{prompt:`<span class="def">${esc(w.en)}</span> <span style="color:var(--muted)">(${esc(w.t)})</span><span class="hint">${esc(pat)}</span>`,input:true,ans:w.w,note:w.vi})});
  // 7 spell
  mixUnits(W.map(l=>l.filter(w=>/^[a-z]+$/i.test(w.w)&&w.w.length>=6)),3).forEach(w=>add("spell",{audio:w.w,prompt:`Gõ lại từ bạn nghe được <span style="color:var(--muted)">(${w.w.length} chữ cái)</span>`,input:true,ans:w.w,note:w.vi}));
  return Q;
}

    let h=`<div class="qbar"><span class="who">${esc(S.name)}${S.cls?" · "+esc(S.cls):""}</span>
      <div class="prog"><span id="pc">0/${S.qs.length}</span><div class="bar"><i id="pb" style="width:0"></i></div></div>
      <span class="clock" id="clk">00:00</span><button class="btn" id="sub1" type="button">Nộp bài</button></div>`;
    PARTS.forEach((p,pi)=>{const qs=S.qs.filter(q=>q.part===p.k);if(!qs.length)return;
      h+=`<div class="part"><span class="dm"></span><div><h3>Phần ${pi+1}. ${p.t}</h3><p>${p.d}</p></div></div>`;
      qs.forEach(q=>{n++;h+=`<div class="q" id="b-${q.id}"><div class="head"><span class="num">${n}.</span><div class="pr">${q.prompt}</div></div>
        ${q.audio?`<p style="margin:0 0 12px"><button type="button" class="listen" data-say="${esc(q.audio)}">${SPK} Nghe</button></p>`:""}
        ${q.input?`<input class="typein" type="text" id="in-${q.id}" data-q="${q.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" value="${esc(S.ans[q.id]||"")}" aria-label="Câu ${n}">`
        :`<div class="ch" role="radiogroup" aria-label="Câu ${n}">${q.opts.map((o,i)=>`<label><input type="radio" name="${q.id}" id="${q.id}-${i}" data-q="${q.id}" value="${esc(o)}" ${S.ans[q.id]===o?"checked":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></label>`).join("")}</div>`}
      </div>`})});
    h+=`<div class="submitrow"><button class="btn lg" id="sub2" type="button">Nộp bài</button></div>`;
    el.innerHTML=h;
    const upd=()=>{const c=S.qs.filter(q=>(S.ans[q.id]||"").trim()).length;$("#pc").textContent=c+"/"+S.qs.length;$("#pb").style.width=(c/S.qs.length*100)+"%"};
    const tick=()=>{const s=Math.floor((Date.now()-S.start)/1000);$("#clk").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
    upd();tick();clockT=setInterval(tick,1000);
    el.oninput=el.onchange=e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){S.ans[q]=e.target.value;upd()}};
    $("#sub1").onclick=$("#sub2").onclick=trySubmit;
    return;
  }
  renderResult();
}
function trySubmit(){
  const miss=S.qs.filter(q=>!(S.ans[q.id]||"").trim());
  if(!miss.length)return finish();
  const d=document.createElement("div");d.className="dlg";d.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">Còn ${miss.length} câu chưa làm</h3><p style="margin:0;color:var(--muted)">Câu bỏ trống sẽ được tính là sai.</p><div class="row"><button class="btn ghost" id="dback">Làm tiếp</button><button class="btn" id="dgo">Vẫn nộp bài</button></div></div>`;
  document.body.appendChild(d);$("#dback").focus();
  $("#dback").onclick=()=>{d.remove();const b=$("#b-"+miss[0].id);b&&b.scrollIntoView({behavior:"smooth",block:"center"})};
  $("#dgo").onclick=()=>{d.remove();finish()};
}
const isRight=q=>{const a=(S.ans[q.id]||"").trim();if(!a)return false;return q.input?variants(q.ans).includes(norm(a)):a===q.ans};
function finish(){S.end=Date.now();S.view="result";renderPractice();window.scrollTo({top:0})}
function code(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36).toUpperCase().padStart(6,"0").slice(-6)}
function renderResult(){
  const tot=S.qs.length,c=S.qs.filter(isRight).length,pct=Math.round(c/tot*100);
  const s10=(c/tot*10).toFixed(1).replace(".",",");
  const [rt,rc]=pct>=90?["Xuất sắc","r-a"]:pct>=80?["Giỏi","r-a"]:pct>=65?["Khá","r-b"]:pct>=50?["Trung bình","r-b"]:["Cần cố gắng","r-c"];
  const d=new Date(S.end),p2=x=>String(x).padStart(2,"0");
  const when=`${p2(d.getHours())}:${p2(d.getMinutes())} · ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
  const sec=Math.round((S.end-S.start)/1000);const dur=`${sec/60|0} phút ${sec%60} giây`;
  const vc=code([S.name,S.cls,c,tot,S.end,S.units.join("")].join("|"));
  let h=`<div class="res" id="rescard">
    <div class="rh"><img src="${LOGO}" alt=""><div><div class="nm">Ms Trâm english hub</div><div class="sb">Kết quả luyện tập từ vựng · Tiếng Anh 11</div></div></div>
    <div class="rb">
      <dl class="meta"><dt>Học sinh</dt><dd>${esc(S.name)}</dd>${S.cls?`<dt>Lớp</dt><dd>${esc(S.cls)}</dd>`:""}
        <dt>Nội dung</dt><dd>${S.units.map(u=>"Unit "+u).join(", ")}</dd><dt>Nộp lúc</dt><dd>${when}</dd><dt>Thời gian làm</dt><dd>${dur}</dd></dl>
      <div class="score"><div class="ring" style="--p:${pct}"><div>${pct}%</div></div>
        <div><div class="big">Đúng ${c}/${tot} câu</div><div>Điểm quy đổi: <b>${s10}/10</b></div><span class="rate ${rc}">${rt}</span></div></div>
      <div class="brk">${PARTS.map((p,i)=>{const qs=S.qs.filter(q=>q.part===p.k);if(!qs.length)return"";const k=qs.filter(isRight).length;
        return `<div><span>${i+1}. ${p.t}</span><span class="bar"><i style="width:${k/qs.length*100}%"></i></span><b>${k}/${qs.length}</b></div>`}).join("")}</div>
    </div>
    <div class="rf"><span>Mã xác nhận: <b>${vc}</b></span><span>Zalo GV: 079 29 51 529</span></div>
  </div>
  <p class="shot">Chụp màn hình khung kết quả trên và gửi cho giáo viên.</p>
  <div class="after"><button class="btn" id="again">Làm đề mới</button><button class="btn ghost" id="torev">Xem lại bài làm</button></div>
  <div id="review">`;
  let n=0;
  PARTS.forEach((p,pi)=>{const qs=S.qs.filter(q=>q.part===p.k);if(!qs.length)return;
    h+=`<div class="part"><span class="dm"></span><div><h3>Phần ${pi+1}. ${p.t}</h3></div></div>`;
    qs.forEach(q=>{n++;const ok=isRight(q),a=(S.ans[q.id]||"").trim();
      h+=`<div class="q rv ${ok?"":"x"}"><div class="head"><span class="num">${n}.</span><div class="pr">${q.prompt.replace('<span class="blank"></span>',`<b style="color:var(--ok)">${esc(q.ans)}</b>`)}
        <div class="yours">${ok?`<span class="right">✓ ${esc(a)}</span>`:`Bạn chọn: ${a?`<span class="wrong">${esc(a)}</span>`:"<i>bỏ trống</i>"} → Đáp án: <span class="right">${esc(q.ans)}</span>`}</div>
        ${q.note?`<div class="note">${esc(q.note)}</div>`:""}</div>${sayBtn(q.say||q.ans,1)}</div></div>`})});
  h+=`</div>`;
  $("#practice").innerHTML=h;
  $("#again").onclick=()=>{S.view="start";renderPractice();window.scrollTo({top:0})};
  $("#torev").onclick=()=>$("#review").scrollIntoView({behavior:"smooth"});
}

/* ---------- Khởi động ---------- */
function start(data){
  if(data&&data.S){S=data.S;Object.assign(V,data.V||{})}
  renderVocab();renderPractice();
  go(data&&data.V?V.view:(location.hash==="#luyen-tap"?"practice":"vocab"));
}
window.claude?.hot?.snapshot?.(()=>({S,V}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
